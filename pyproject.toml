[project]
name = "slushy-build"
version = "0.1.0"
description = "Consolidate build requirements for a package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.6.1",
    "packaging>=26.2",
    "pybuild-deps>=0.5.0",
    "typer>=0.26.8",
]

[project.scripts]
slushy-build = "slushy_build.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slushy_build"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-mock>=3.0", "ruff>=0.11"]

[tool.ruff]
line-length = 120
